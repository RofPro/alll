<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مركز خطوة المستقبل - النظام الموحد</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--p:#0284c7;--bg:#f4f8fa;--t:#0f172a;--g:#64748b;--c:#fff;--l:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--t:#f1f5f9;--g:#94a3b8;--c:#1e293b;--l:#334155}}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--t);font-size:14px}
.hidden{display:none!important}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:18px;margin-bottom:14px}
#login .card{width:100%;max-width:380px}
h2,h3{color:var(--p);margin-bottom:12px}
label{display:block;font-weight:700;font-size:12px;margin-bottom:10px}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border:1.5px solid var(--l);border-radius:9px;background:var(--bg);color:var(--t)}
.b{background:var(--p);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;margin:2px}
.b.r{background:#e11d48}.b.gr{background:#16a34a}.b.o{background:var(--c);color:var(--t);border:1px solid var(--l)}.b:disabled{opacity:.4;cursor:not-allowed}
#side{position:fixed;top:0;right:0;width:250px;height:100vh;background:var(--c);border-left:1px solid var(--l);padding:14px;overflow:auto;z-index:50;transition:transform .25s;transform:translateX(100%)}
#side.open{transform:none}
#side .nav{display:flex;gap:10px;align-items:center;width:100%;text-align:right;background:none;border:0;color:var(--g);padding:10px;border-radius:9px;font-weight:700;cursor:pointer;margin-bottom:3px}
#side .nav.on,#side .nav:hover{background:var(--bg);color:var(--p)}
#main{padding:16px}
#bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
@media(min-width:900px){#side{transform:none}#app{margin-right:250px}#mb{display:none}}
.ov{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;text-align:right;border-bottom:1px solid var(--l);white-space:nowrap}th{color:var(--g)}
.mu{text-align:center;color:var(--g)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kp h2{margin:4px 0 0;color:var(--t)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.tg{padding:3px 9px;border-radius:7px;font-size:12px;font-weight:700;background:var(--bg)}
dialog{margin:auto;border:0;border-radius:14px;padding:18px;width:min(92vw,460px);background:var(--c);color:var(--t)}
dialog::backdrop{background:#0008}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;display:grid;gap:8px;width:90%;max-width:380px}
.toast{padding:12px;border-radius:10px;background:var(--c);border-right:5px solid;font-weight:700;box-shadow:0 4px 14px #0003}
.toast.ok{border-color:#16a34a}.toast.er{border-color:#e11d48}
</style></head><body>
<div id="toasts"></div>
<div id="login"><div class="card"><h2><i class="fa-solid fa-hospital-user"></i> مركز خطوة المستقبل</h2>
<label>البريد الإلكتروني<input id="em" type="email" autocomplete="username"></label>
<label>كلمة المرور<input id="pw" type="password" autocomplete="current-password"></label>
<button class="b" style="width:100%" data-a="login">دخول</button></div></div>
<div id="app" class="hidden">
<aside id="side"><h3 id="who" style="margin-bottom:4px"></h3><small id="rl" style="color:var(--g)"></small><hr style="margin:10px 0;border-color:var(--l)"><nav id="nav"></nav>
<button class="b r" style="width:100%;margin-top:12px" data-a="logout">خروج</button></aside>
<div id="main"><div id="bar"><button id="mb" class="b o" data-a="menu"><i class="fa-solid fa-bars"></i></button><b>مركز خطوة المستقبل للعلاج الطبيعي</b></div><div id="scr"></div></div>
</div>
<dialog id="dlg"></dialog>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,addDoc,deleteDoc,doc,updateDoc,setDoc,getDoc,onSnapshot,writeBatch,query,where}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCnpbMGZCteZ9w_i5Rx0sKynle_qz0p2tk",authDomain:"mrkzalalgaltbay.firebaseapp.com",projectId:"mrkzalalgaltbay",storageBucket:"mrkzalalgaltbay.firebasestorage.app",messagingSenderId:"345480027808",appId:"1:345480027808:web:b8ca2b27761d3b912733c5"});
const auth=getAuth(app),db=getFirestore(app);

/* ---------- أدوات ---------- */
const $=id=>document.getElementById(id);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const V=s=>s||s===0?E(s):'—';
const toast=(m,ok)=>{const d=document.createElement('div');d.className='toast '+(ok?'ok':'er');d.textContent=m;$('toasts').append(d);setTimeout(()=>d.remove(),3200)};
const run=(p,m)=>p.then(()=>{m&&toast(m,1);return true}).catch(e=>{toast('فشل: '+(e.code||e.message),0);return false});
const today=()=>new Date().toLocaleDateString('en-CA');
const val=id=>($(id)?.value||'').trim();
const T=(h,r,em='لا توجد بيانات')=>`<div class=ov><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.length?r.map(c=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan=${h.length} class=mu>${em}</td></tr>`}</tbody></table></div>`;
const B=(a,id,t,c='',x='')=>`<button class="b ${c}" data-a="${a}" data-id="${E(id)}" ${x}>${t}</button>`;
const I=(id,l,t='text')=>`<label>${l}<input id="${id}" type="${t}"></label>`;
const S=(id,l,o)=>`<label>${l}<select id="${id}">${o.map(x=>`<option value="${E(x[0])}">${E(x[1])}</option>`).join('')}</select></label>`;
const O=a=>a.map(x=>[x,x]);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const rnd=(n,ch)=>Array.from(crypto.getRandomValues(new Uint32Array(n)),x=>ch[x%ch.length]).join('');
const ST={pending:'بانتظار الحضور',attended:'حاضر',completed:'مكتملة',no_show:'تخلّف'};
const TIMES=O(Array.from({length:11},(_,i)=>String(i+8).padStart(2,'0')+':00'));

/* ---------- الحالة ---------- */
const D={children:[],appointments:[],staff:[],reports:[],attendance:[],invoices:[]};
const U={};let cur='home',unsubs=[],PERM=null,af='pending',child=null;
const DEF={manager:['home','checkin','queue','newfile','appr','att','fin','children','staff'],doctor:['home','doctor'],reception:['home','checkin','queue','booking','newfile','fin','children']};
const staffOpts=()=>[['','-- اختر الأخصائي --'],...D.staff.map(s=>[s.name,`${s.name} (${s.title||''})`])];
const fillStaff=id=>{const s=$(id);if(s&&s.options.length!==D.staff.length+1){const v=s.value;s.innerHTML=staffOpts().map(o=>`<option value="${E(o[0])}">${E(o[1])}</option>`).join('');s.value=v}};

/* ---------- الشاشات: r = الهيكل (مرة واحدة)، u = تحديث البيانات ---------- */
const SC={
home:{n:'الإحصائيات',i:'chart-pie',r:()=>'<div class=kp id=kp></div>',u(){const k=$('kp');if(!k)return;
 k.innerHTML=[['الأطفال',D.children.length],['المواعيد',D.appointments.length],['مواعيد اليوم',D.appointments.filter(a=>a.date===today()).length],['الأخصائيون',D.staff.length],['تقارير بانتظار الاعتماد',D.reports.filter(r=>r.status==='pending').length]].map(([a,b])=>`<div class=card><small>${a}</small><h2>${b}</h2></div>`).join('')}},

checkin:{n:'المواعيد وتأكيد الحضور',i:'user-check',r:()=>`<div class=card><h3>الاستعلام وتأكيد الحضور</h3>${I('q','رقم الملف أو الاسم أو الهوية')}<div id=tb></div></div>`,u(){
 if(!$('tb'))return;const q=val('q').toLowerCase();
 const r=q?D.appointments.filter(a=>[a.fileNo,a.childName,a.idno].some(x=>String(x||'').toLowerCase().includes(q))):[];
 $('tb').innerHTML=T(['الملف','الطفل','الخدمة','الأخصائي','الموعد','الحالة','إجراء'],r.map(a=>[V(a.fileNo),V(a.childName),V(a.service),V(a.doctor),V(a.date)+' '+V(a.time),`<span class=tg>${ST[a.status]||'—'}</span>`,a.status==='pending'?B('attend',a.id,'تسجيل حضور','gr')+B('noshow',a.id,'تخلّف','r'):'']),q?'لا نتائج':'ابحث بالملف أو الاسم')}},

queue:{n:'قائمة الانتظار',i:'people-line',r:()=>'<div class=card><h3>قائمة الانتظار (اليوم)</h3><div id=tb></div></div>',u(){
 if(!$('tb'))return;const r=D.appointments.filter(a=>a.status==='attended'&&a.date===today()).sort((a,b)=>(a.attendedAt||'').localeCompare(b.attendedAt||''));
 $('tb').innerHTML=T(['الدور','الملف','الطفل','الأخصائي','وقت الحضور'],r.map((a,i)=>[i+1,V(a.fileNo),V(a.childName),V(a.doctor),a.attendedAt?new Date(a.attendedAt).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'—']),'لا توجد حالات حاضرة')}},

booking:{n:'إضافة موعد',i:'calendar-plus',r:()=>{child=null;return`<div class=card style="max-width:620px"><h3>موعد جديد</h3>${I('fno','رقم الملف')}<button class=b data-a=find>بحث</button><div id=fc style="margin:10px 0"></div>
 <div class=g2>${S('bs','الخدمة',O(['جلسة علاج طبيعي','جلسة علاج وظيفي','جلسة تخاطب ونطق']))}${S('bd','الأخصائي',staffOpts())}${I('bdt','التاريخ','date')}${S('bt','الوقت',TIMES)}</div><button class=b data-a=book>حفظ الموعد</button></div>`},u(){fillStaff('bd')}},

newfile:{n:'فتح ملف جديد',i:'folder-plus',r:()=>`<div class=card style="max-width:720px"><h3>ملف جديد</h3><div class=g2>${I('mn','اسم الأم')}${I('mp','جوال الأم (05xxxxxxxx)','tel')}${I('cn','اسم الطفل')}${I('ci','رقم هوية الطفل')}${I('cd','تاريخ الميلاد','date')}${S('cg','الجنس',O(['ذكر','أنثى']))}</div>${I('cx','التشخيص')}${S('cs','الحالة',O(['تقييم أولي جديد','مستمر في التأهيل','ما بعد جراحة عظمية']))}<label>التاريخ الطبي<textarea id=ch rows=2></textarea></label><button class=b data-a=create>حفظ وإرسال بيانات الدخول</button></div>`},

doctor:{n:'بوابة الأطباء',i:'user-doctor',r:()=>'<div class=card><h3>حالاتي</h3><div id=tb></div></div>',u(){
 if(!$('tb'))return;const r=D.appointments.filter(a=>(U.role!=='doctor'||a.doctor===U.name)&&a.status!=='completed'&&a.status!=='no_show').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 $('tb').innerHTML=T(['الطفل','الخدمة','الموعد','الحالة','الجلسة'],r.map(a=>[V(a.childName)+`<br><small>${V(a.fileNo)}</small>`,V(a.service),V(a.date)+' '+V(a.time),`<span class=tg>${ST[a.status]||'—'}</span>`,B('sess',a.id,'بدء الجلسة','gr',a.status==='attended'?'':'disabled title="لم يسجَّل حضور الطفل"')]),'لا توجد حالات')}},

appr:{n:'اعتماد التقارير',i:'stamp',r:()=>`<div class=card><h3>اعتماد التقارير</h3>${B('flt','pending','بانتظار الاعتماد')}${B('flt','approved','المعتمدة','o')}<div id=tb style="margin-top:10px"></div></div>`,u(){
 if(!$('tb'))return;const r=D.reports.filter(x=>x.status===af);
 $('tb').innerHTML=T(['الملف','الطفل','الأخصائي','التشخيص','الملاحظات','التمارين','إجراء'],r.map(x=>[V(x.fileNo),V(x.childName),V(x.doctor),V(x.diagnosis),V(x.notes),V(x.exercise),af==='pending'?B('approve',x.id,'اعتماد','gr'):'معتمد']),'لا توجد تقارير')}},

att:{n:'حضور الموظفين',i:'fingerprint',r:()=>'<div class=card><h3>الحضور والانصراف - <span id=dt></span></h3><div id=tb></div></div>',u(){
 if(!$('tb'))return;$('dt').textContent=today();
 const m={};D.attendance.filter(a=>a.date===today()).forEach(a=>m[a.staffId]=a);
 $('tb').innerHTML=T(['الاسم','المسمى','الحالة','دخول','خروج','إجراء'],D.staff.map(s=>{const a=m[s.id]||{};return[V(s.name),V(s.title),a.status==='left'?'انصرف':a.status==='present'?'حاضر':'لم يسجل',V(a.in),V(a.out),B('in',s.id,'حضور','gr',a.in?'disabled':'')+B('out',s.id,'انصراف','r',a.in&&!a.out?'':'disabled')]}))}},

fin:{n:'الفواتير',i:'file-invoice-dollar',r:()=>`<div class=card style="max-width:620px"><h3>سند قبض</h3><div class=g2>${I('fc1','رقم الملف أو اسم الطفل')}${I('fs','الخدمة/الباقة')}${I('fa','المبلغ (ر.س)','number')}${S('fm','الدفع',O(['شبكة (مدى)','نقداً','تحويل بنكي','تمارا / تابي']))}</div><button class=b data-a=inv>حفظ السند</button></div><div class=card><h3>آخر السندات</h3><div id=tb></div></div>`,u(){
 if(!$('tb'))return;const r=[...D.invoices].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,15);
 $('tb').innerHTML=T(['التاريخ','المراجع','الخدمة','المبلغ','الدفع','أصدره'],r.map(x=>[V(x.date),V(x.client),V(x.service),V(x.amount),V(x.method),V(x.by)]))}},

children:{n:'سجلات الأطفال',i:'children',r:()=>'<div class=card><h3>الأطفال</h3><div id=tb></div></div>',u(){
 if(!$('tb'))return;$('tb').innerHTML=T(['الملف','الاسم','الهوية','التشخيص','جوال ولي الأمر','انضمام','إجراء'],D.children.map(c=>[V(c.fileNo),V(c.name),V(c.idno),V(c.diagnosis),V(c.momPhone),V(c.joinDate),B('delchild',c.id,'حذف','r')]))}},

staff:{n:'شؤون الأخصائيين',i:'id-card-clip',r:()=>`<div class=card style="max-width:620px"><h3>إضافة أخصائي</h3><div class=g2>${I('sn','الاسم')}${I('st','المسمى')}${I('sp','الجوال','tel')}</div><button class=b data-a=addstaff>حفظ</button></div><div class=card><div id=tb></div></div>`,u(){
 if(!$('tb'))return;$('tb').innerHTML=T(['الرقم الوظيفي','الاسم','المسمى','الجوال','إجراء'],D.staff.map(s=>[V(s.empNo),V(s.name),V(s.title),V(s.phone),B('delstaff',s.id,'حذف','r')]))}},

perm:{n:'الصلاحيات (IT)',i:'shield-halved',r:()=>`<div class=card style="max-width:700px"><h3>صلاحيات الأقسام</h3>${S('pr','القسم',[['manager','المدير'],['doctor','الأطباء'],['reception','الاستقبال']])}<div id=pc class=g2></div><button class=b data-a=saveP>حفظ سحابياً</button></div>
 <div class=card style="max-width:700px"><h3>ربط حساب بدور</h3><small>أنشئ المستخدم في Firebase Authentication ثم انسخ UID هنا.</small><div class=g2 style="margin-top:8px">${I('uu','UID')}${I('un','الاسم (يطابق اسم الأخصائي للأطباء)')}${S('ur','الدور',[['manager','مدير'],['doctor','طبيب'],['reception','استقبال'],['it','IT']])}</div><button class=b data-a=saveU>حفظ</button></div>`,u(){
 if(!$('pc')||$('pc').dataset.r===$('pr').value)return;const r=$('pr').value;$('pc').dataset.r=r;const p=(PERM||DEF)[r]||[];
 $('pc').innerHTML=Object.keys(SC).filter(k=>k!=='perm').map(k=>`<label><input type=checkbox style="width:auto" value="${k}" ${p.includes(k)?'checked':''}> ${SC[k].n}</label>`).join('')}}
};

/* ---------- تنقل ---------- */
const allowed=()=>U.role==='it'?Object.keys(SC):((PERM||DEF)[U.role]||[]).filter(k=>SC[k]&&k!=='perm');
function nav(){$('nav').innerHTML=allowed().map(k=>`<button class="nav ${k===cur?'on':''}" data-a=go data-id=${k}><i class="fa-solid fa-${SC[k].i}"></i>${SC[k].n}</button>`).join('')}
function go(id){if(!allowed().includes(id))return;cur=id;$('scr').innerHTML=SC[id].r();SC[id].u?.();nav();$('side').classList.remove('open');scrollTo(0,0)}
function listen(){unsubs.forEach(f=>f());
 const doc_=U.role==='doctor';
 unsubs=Object.keys(D).filter(k=>!doc_||k==='appointments'||k==='staff').map(k=>{const ref=collection(db,k);
  const src=doc_&&k==='appointments'?query(ref,where('doctor','==',U.name)):ref;
  return onSnapshot(src,s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));SC[cur]?.u?.()},e=>console.warn(k,e.code))});
 unsubs.push(onSnapshot(doc(db,'settings','role_permissions'),s=>{PERM=s.exists()?s.data():null;nav();if(!allowed().includes(cur))go(allowed()[0])},()=>{}))}

onAuthStateChanged(auth,async u=>{
 if(!u){unsubs.forEach(f=>f());unsubs=[];$('app').classList.add('hidden');$('login').classList.remove('hidden');return}
 try{const s=await getDoc(doc(db,'users',u.uid));
  if(!s.exists()){const id=u.uid;await signOut(auth);prompt('هذا الحساب بلا دور. انسخ الـ UID التالي وأعطه للـ IT (أو ضعه كاسم مستند في users):',id);return}
  Object.assign(U,{uid:u.uid,...s.data()});
 }catch(e){toast('تعذر قراءة الصلاحيات: '+e.code,0);return signOut(auth)}
 $('who').textContent=U.name||u.email;$('rl').textContent={manager:'المدير',doctor:'طبيب',reception:'استقبال',it:'IT'}[U.role]||'';
 $('login').classList.add('hidden');$('app').classList.remove('hidden');listen();go(allowed()[0]||'home')});

/* ---------- الإجراءات (تفويض الأحداث بدل onclick المضمّن) ---------- */
const sub=(c,id,d)=>run(updateDoc(doc(db,c,id),d),'تم');
const A={
 login(){run(signInWithEmailAndPassword(auth,val('em'),$('pw').value))},
 logout(){signOut(auth)},menu(){$('side').classList.toggle('open')},go,
 attend:id=>sub('appointments',id,{status:'attended',attendedAt:new Date().toISOString()}),
 noshow:id=>sub('appointments',id,{status:'no_show'}),
 find(){const f=val('fno').toLowerCase();child=D.children.find(c=>String(c.fileNo||'').toLowerCase()===f)||null;
  $('fc').innerHTML=child?`<div class=card><b>${E(child.name)}</b><br><small>التشخيص: ${V(child.diagnosis)} | ولي الأمر: ${V(child.momName)}</small></div>`:'';if(!child)toast('لا يوجد طفل بهذا الرقم',0)},
 async book(){const doctor=val('bd'),date=val('bdt'),time=val('bt');
  if(!child)return toast('اجلب بيانات الطفل أولاً',0);if(!doctor||!date)return toast('اختر الأخصائي والتاريخ',0);
  if(date<today())return toast('لا يمكن الحجز بتاريخ سابق',0);
  if(D.appointments.some(a=>a.doctor===doctor&&a.date===date&&a.time===time&&a.status!=='no_show'))return toast('الأخصائي محجوز في هذا الوقت',0);
  if(await run(addDoc(collection(db,'appointments'),{childName:child.name,fileNo:child.fileNo,idno:child.idno||'',service:val('bs'),doctor,date,time,status:'pending',createdBy:U.name,createdAt:new Date().toISOString()}),'تم حفظ الموعد'))go('checkin')},
 async create(){const mn=val('mn'),mp=val('mp').replace(/\D/g,''),cn=val('cn'),ci=val('ci'),dob=val('cd'),dx=val('cx');
  if(!mn||!mp||!cn||!dob||!dx)return toast('أكمل الحقول الأساسية',0);
  if(!/^05\d{8}$/.test(mp))return toast('رقم الجوال يجب أن يكون 05xxxxxxxx',0);
  if(ci&&D.children.some(c=>c.idno===ci))return toast('رقم الهوية مسجل مسبقاً',0);
  let fileNo;do{fileNo='26'+rnd(4,'0123456789')}while(D.children.some(c=>c.fileNo===fileNo));
  const username=rnd(6,'ABCDEFGHJKLMNPQRSTUVWXYZ'),pass=rnd(8,'abcdefghjkmnpqrstuvwxyz23456789');
  const ok=await run((async()=>{const b=writeBatch(db);

   b.set(doc(collection(db,'moms_users')),{momName:mn,phone:mp,username,passHash:await sha(pass),mustChange:true,childName:cn,fileNo,createdAt:new Date().toISOString()});

 sess(id){const a=D.appointments.find(x=>x.id===id);if(!a||a.status!=='attended')return toast('لم يسجَّل حضور الطفل',0);

 close(){$('dlg').close()},
 async sub(id){const a=D.appointments.find(x=>x.id===id),dx=val('sd'),nt=val('sn2');if(!a||!dx||!nt)return toast('أدخل التشخيص والملاحظات',0);

 delchild(id){const c=D.children.find(x=>x.id===id);if(!c)return;
  if(D.appointments.some(a=>a.fileNo===c.fileNo))return toast('لا يمكن الحذف: للطفل مواعيد مرتبطة',0);
  confirm(`حذف ملف ${c.name} نهائياً؟`)&&run(deleteDoc(doc(db,'children',id)),'تم الحذف')},
 delstaff(id){const s=D.staff.find(x=>x.id===id);if(!s)return;
  if(D.appointments.some(a=>a.doctor===s.name&&a.status==='pending'))return toast('للأخصائي مواعيد قائمة',0);
  confirm(`حذف ${s.name} نهائياً؟`)&&run(deleteDoc(doc(db,'staff',id)),'تم الحذف')},
 async addstaff(){const name=val('sn'),title=val('st');if(!name||!title)return toast('أدخل الاسم والمسمى',0);
  if(await run(addDoc(collection(db,'staff'),{name,title,phone:val('sp'),empNo:'EMP-'+rnd(4,'0123456789'),status:'مستمر',joinDate:today()}),'تم الحفظ'))['sn','st','sp'].forEach(i=>$(i).value='')},
 async saveP(){const r=val('pr'),p=[...document.querySelectorAll('#pc input:checked')].map(c=>c.value);
